services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: trackdna
      POSTGRES_USER: trackdna
      POSTGRES_PASSWORD: trackdna
    ports:
      - "5432:5432"
    volumes:
      - trackdna_postgres:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackdna -d trackdna"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - trackdna_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 20

  audio-worker:
    build:
      context: ./apps/api
    command: python -m app.workers.audio_worker
    env_file:
      - .env.example
    volumes:
      - ./apps/api:/app
      - trackdna_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  trackdna_postgres:
  trackdna_uploads:
